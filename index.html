<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuisioner Soto</title>
<style>
  :root {
    --bg: #f5f5f2;
    --ink: #1c1c1c;
    --muted: #6b6b6b;
    --line: #d9d9d4;
    --accent: #2f4f3e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }

  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 18px 22px 0;
    z-index: 5;
    opacity: 0;
    transition: opacity .4s;
  }
  header.on { opacity: 1; }
  .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .5s cubic-bezier(.2,.8,.2,1); }

  #stage { position: relative; height: 100%; width: 100%; }
  .slide {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 80px 24px 40px;
    text-align: center;
    opacity: 0; transform: translateX(60px);
    transition: opacity .35s ease, transform .35s cubic-bezier(.2,.8,.2,1);
    pointer-events: none;
  }
  .slide.active { opacity: 1; transform: none; pointer-events: auto; }
  .slide.leave { opacity: 0; transform: translateX(-60px); }
  @media (prefers-reduced-motion: reduce) { .slide { transition: opacity .2s; transform: none !important; } }

  .q { font-size: clamp(26px, 6vw, 42px); font-weight: 600; line-height: 1.2; max-width: 560px; margin: 0 0 36px; }
  .q.big { font-size: clamp(40px, 10vw, 72px); }
  .sub { font-size: 16px; color: var(--muted); margin: -20px 0 32px; max-width: 420px; }
  .btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: center; }

  button {
    font: inherit; font-size: 17px;
    padding: 13px 26px;
    border-radius: 10px;
    border: 1.5px solid var(--ink);
    background: transparent; color: var(--ink);
    cursor: pointer;
    transition: transform .15s ease, background .15s, color .15s, border-color .15s, font-size .3s, padding .3s, opacity .3s;
  }
  button.primary { background: var(--ink); color: #fff; }
  button:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
  button.primary:hover { background: var(--accent); color: #fff; }
  button:active { transform: scale(.97); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  button:disabled { opacity: .35; cursor: default; transform: none; }

  button.dodge { position: fixed; z-index: 10; transition: left .25s cubic-bezier(.2,.8,.2,1), top .25s cubic-bezier(.2,.8,.2,1), opacity .3s; }
  button.tiny { font-size: 13px; padding: 7px 14px; opacity: .7; }
  button.huge { font-size: 24px; padding: 20px 44px; }
  button.giant { font-size: clamp(22px, 5vw, 34px); padding: 28px 12vw; border-radius: 16px; }
  .hint { font-size: 14px; color: var(--muted); margin-top: 22px; min-height: 20px; }

  form { width: 100%; max-width: 360px; text-align: left; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  input {
    font: inherit; font-size: 16px; width: 100%;
    padding: 11px 13px;
    border: 1.5px solid var(--line); border-radius: 10px;
    background: #fff; color: var(--ink);
  }
  input:focus { outline: none; border-color: var(--accent); }
  form .btns { margin-top: 26px; }

  .clickbox {
    border: 2px dashed var(--ink); border-radius: 14px;
    padding: 34px 48px; font-size: 18px;
    cursor: pointer; user-select: none;
    transition: transform .12s ease, border-color .15s, color .15s;
  }
  .clickbox:hover { border-style: solid; border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
  .clickbox:active { transform: scale(.97); }

  .grade {
    font-size: clamp(90px, 25vw, 160px);
    font-weight: 700; line-height: 1;
    color: var(--accent);
    margin: 0 0 8px;
    animation: stamp .5s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes stamp { from { transform: scale(2.2) rotate(-12deg); opacity: 0; } to { transform: none; opacity: 1; } }

  a.wa {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 18px; font-weight: 600; color: #fff;
    background: #25D366; text-decoration: none;
    padding: 14px 28px; border-radius: 12px;
    transition: transform .12s ease, filter .15s;
  }
  a.wa:hover { transform: translateY(-2px); filter: brightness(.95); }
  a.wa:active { transform: scale(.97); }
  a.wa svg { width: 22px; height: 22px; fill: currentColor; }
  .num { font-size: 14px; color: var(--muted); margin-top: 14px; }
</style>
</head>
<body>
<header id="hdr">
  <div class="meta"><span>Kuisioner Soto</span><span id="part"></span></div>
  <div class="bar"><i id="fill"></i></div>
</header>
<div id="stage"></div>

<script>
  const NAMA = "Dini";
  const CONTACT = "+62 859-2167-3861";
  const WA_LINK = "https://wa.me/6285921673861";
  const TOTAL = 4;

  const stage = document.getElementById("stage");
  const hdr = document.getElementById("hdr");
  let current = null;
  let picked = { date: "", time: "", place: "" };

  function progress(n) {
    if (!n) { hdr.classList.remove("on"); return; }
    hdr.classList.add("on");
    document.getElementById("part").textContent = `bagian ${n}/${TOTAL}`;
    document.getElementById("fill").style.width = (n / TOTAL * 100) + "%";
  }

  function show(html, part) {
    const next = document.createElement("section");
    next.className = "slide";
    next.innerHTML = html;
    stage.appendChild(next);
    if (current) {
      const old = current;
      old.classList.remove("active");
      old.classList.add("leave");
      setTimeout(() => old.remove(), 400);
    }
    requestAnimationFrame(() => requestAnimationFrame(() => next.classList.add("active")));
    current = next;
    progress(part);
    return next;
  }

  function ask(text, options, part, sub, cls = "") {
    const btns = options.map((o, i) =>
      `<button class="${o.cls || ""}" data-i="${i}">${o.label}</button>`
    ).join("");
    const el = show(`<h1 class="q ${cls}">${text}</h1>${sub ? `<p class="sub">${sub}</p>` : ""}<div class="btns">${btns}</div>`, part);
    el.querySelectorAll("button").forEach(b =>
      b.addEventListener("click", () => options[+b.dataset.i].next(), { once: true })
    );
    return el;
  }

  /* 0. sapaan */
  function intro() {
    show(`<h1 class="q big">Halo ${NAMA}</h1><p class="sub">ada kuisioner singkat, 4 bagian aja</p>`, 0);
    setTimeout(step1, 1800);
  }

  /* 1. pertanyaan utama, tombol nggajadi kabur */
  function step1() {
    const el = ask("Jadi makan soto ga kita", [
      { label: "nggajadi", next: step2 },
      { label: "jadi", cls: "primary", next: fillForm },
    ], 1);
    el.insertAdjacentHTML("beforeend", `<p class="hint" id="hint"></p>`);

    const no = el.querySelector("button[data-i='0']");
    const hint = el.querySelector("#hint");
    const lines = ["eh", "ga bisa dipencet ya?", "coba lagi", "yaudah deh, silakan"];
    let dodges = 0;

    const dodge = (e) => {
      if (dodges >= 3) return;
      if (e.type === "touchstart") e.preventDefault();
      const r = no.getBoundingClientRect();
      if (!no.classList.contains("dodge")) {
        no.classList.add("dodge");
        no.style.left = r.left + "px";
        no.style.top = r.top + "px";
        requestAnimationFrame(() => {});
      }
      const pad = 16;
      const x = pad + Math.random() * (window.innerWidth - r.width - pad * 2);
      const y = 90 + Math.random() * (window.innerHeight - r.height - 130);
      no.style.left = x + "px";
      no.style.top = y + "px";
      dodges++;
      hint.textContent = lines[dodges];
      if (dodges >= 3) { no.style.opacity = "1"; }
    };
    no.addEventListener("mouseenter", dodge);
    no.addEventListener("touchstart", dodge, { passive: false });
    no.addEventListener("click", (e) => { if (dodges < 3) { e.stopImmediatePropagation(); dodge(e); } }, true);
  }

  /* 2. tombol ogah mengecil, tombol jadi membesar */
  function step2() {
    ask("jadiin dong", [
      { label: "tetep ogah", cls: "tiny", next: step3 },
      { label: "yaudah jadi", cls: "primary huge", next: fillForm },
    ], 1);
  }

  /* 3. satu tombol raksasa */
  function step3() {
    ask("nggamau tau kudu jadi", [
      { label: "iya deh", cls: "primary giant", next: fillForm },
    ], 1, "tombolnya cuma satu, maaf ya");
  }

  /* 4. jadwal */
  function fillForm() {
    const el = show(`
      <h1 class="q">Yaudah tanggalnya tolong diisi ya bu</h1>
      <form id="f">
        <label for="d">Tanggal</label><input id="d" type="date" required>
        <label for="t">Jam</label><input id="t" type="time" required>
        <label for="p">Tempatnya dimana</label><input id="p" type="text" placeholder="nama warung / daerah" required>
        <div class="btns"><button class="primary" id="go" type="button" disabled>Enter</button></div>
      </form>
    `, 2);
    const f = el.querySelector("#f"), d = el.querySelector("#d"), t = el.querySelector("#t"), p = el.querySelector("#p"), go = el.querySelector("#go");
    const check = () => { go.disabled = !(d.value && t.value && p.value.trim()); };
    const submit = () => {
      check();
      if (go.disabled) return;
      picked = { date: d.value, time: t.value, place: p.value.trim() };
      confirmStep();
    };
    [d, t, p].forEach(i => {
      i.addEventListener("input", check);
      i.addEventListener("change", check);
      i.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); submit(); } });
    });
    go.addEventListener("click", submit);
    f.addEventListener("submit", e => { e.preventDefault(); submit(); });
    setTimeout(() => d.focus(), 400);
  }

  function niceDate() {
    const dt = new Date(picked.date + "T" + picked.time);
    return dt.toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  }

  /* 5. konfirmasi */
  function confirmStep() {
    ask("yakin ya?", [
      { label: "ya", next: gradeStep },
      { label: "harus iya", cls: "primary", next: gradeStep },
    ], 3, `${niceDate()}, jam ${picked.time} di ${picked.place}`);
  }

  /* 6. nilai */
  function gradeStep() {
    const el = show(`
      <div class="grade">A</div>
      <h1 class="q">dapet nilai A, bisa ngeklik terus sampe sini</h1>
      <div class="clickbox" id="box">coba klik ini</div>
    `, 4);
    el.querySelector("#box").addEventListener("click", finalStep, { once: true });
  }

  /* 7. kontak */
  function finalStep() {
    const msg = `Suf, hasil kuisioner soto: A. ${niceDate()} jam ${picked.time} di ${picked.place} ya. Jangan telat.`;
    const href = `${WA_LINK}?text=${encodeURIComponent(msg)}`;
    show(`
      <h1 class="q">yaudah kontak nomer ini buat infoin ya soal kuisioner ini, kasih tau dapet nilai A</h1>
      <a class="wa" href="${href}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.5-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4zM12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>
        Chat di WhatsApp
      </a>
      <p class="num">${CONTACT}</p>
    `, 4);
  }

  intro();
</script>
</body>
</html>
